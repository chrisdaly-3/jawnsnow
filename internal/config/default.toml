# jawnSnow config — ~/.config/jawnsnow/config.toml
# snow created this file once with the defaults. It reloads it when it changes and never writes to it again.
# Durations are Go-style: "90s", "5m", "36h"; "d" (days) is also accepted.

# ─── Mode ─────────────────────────────────────────────────────────────────────
[mode]
# The mode jawnSnow starts in.
#   "watcher" — poll and show statuses only; reviews run only when you press space.
#   "auto"    — also queue Claude reviews in the background (section 7 of the design).
# Press `m` in the TUI to switch for the current session; this sets the start value.
# Default: "watcher"
default = "watcher"

# ─── GitHub ───────────────────────────────────────────────────────────────────
[github]
# How often every feed is searched and every PR on the wall is refreshed.
# Minimum "1m". Press `R` to poll right away. jawnSnow also slows down by itself
# when GitHub's rate limit runs low.
# Default: "3m"
poll_interval = "3m"

# How often PRs in the Done view's "Waiting for new activity" table (hidden or
# stale) are checked for new activity. Kept slower than poll_interval to save
# rate limit.
# Default: "15m"
idle_poll_interval = "15m"

# Check names (globs) that never count as pending or failed, in every repo.
# Use this for gates that wait on a review rather than on CI, such as a code-owner
# approval check, so the PR isn't stuck in "Waiting on CI". Combined with each
# repo's own ignore_checks below.
# Default: [] (every required check counts)
ignore_checks = []

# ─── Feeds: which PRs you're subscribed to ────────────────────────────────────
# Each [[feeds]] block is one GitHub search. A PR is on the wall if any feed finds
# it. Once found, it stays tracked until it merges, closes, goes stale or you hide it.
# Default: one feed, "is:pr is:open review-requested:@me" with since = "14d".

[[feeds]]
# Label shown in filters and on cards. Required, and must be unique.
# The default feed is named "review-requested".
name = "review-requested"

# Any standard GitHub PR search. jawnSnow adds "draft:false" (unless
# include_drafts) and the "updated:>=" time gate from `since`. Required.
# The default feed's query is "is:pr is:open review-requested:@me".
query = "is:pr is:open review-requested:@me"

# Time gate: only PRs updated within this window. A tracked PR with no activity
# for this long moves to "Waiting for new activity" (stale). Days or hours.
# Default: "14d"
since = "14d"

# Treat this as a team feed: when another teammate has already submitted a review
# at the PR's current head, auto-review skips that head. The PR stays on the wall,
# and new commits put it back in the queue. `space` still forces a review.
# Default: false
team = false

# Include draft PRs from this feed.
# Default: false
include_drafts = false

# ─── Done view ────────────────────────────────────────────────────────────────
[done]
# How long merged/closed PRs stay in the Done view, and how long a hidden or stale
# PR waits with no activity before jawnSnow stops tracking it. Reviews and cost
# history stay in the database after that.
# Default: "30d"
keep_for = "30d"

# ─── Repositories ─────────────────────────────────────────────────────────────
# Per-repo settings, keyed by "owner/name". A repo with no entry uses the defaults
# shown for each key. Reviews of a repo with no `path` use a blobless clone that
# jawnSnow makes under ~/.local/share/jawnsnow/.

# [repos."chainguard-dev/mono"]
# Your existing local clone. jawnSnow fetches PR refs into it (under
# refs/jawnsnow/) and creates its own worktrees from it, never touching your
# branches or worktrees.
# Default: unset (jawnSnow clones the repo itself)
# path = "~/code/mono"

# How much the reviewer reads.
#   "full"    — the whole codebase around the change: callers, docs, tests.
#   "pr-only" — only the PR's own diff and files, plus a light security pass;
#               for repos that are mostly data (package definitions, configs).
# Default: "full"
# scope = "full"

# Other local repos the reviewer may read for reference (added with --add-dir).
# Default: []
# context = []

# Extra review rules for this repo, applied when the diff touches what they
# describe (the prompt's "focus rules", step 9).
# Default: []
# focus = []

# Design documents the reviewer should always treat as the yardstick for this repo
# (paths in the repo, PR numbers or URLs).
# Default: []
# design_refs = []

# Check names (globs) ignored in this repo only, on top of [github].ignore_checks.
# Example name; use the check name exactly as GitHub shows it.
# Default: []
# ignore_checks = ["codeowners-gate*"]

# [repos."chainguard-dev/stereo"]
# No path: jawnSnow clones it. Mostly package definitions, so review the PR only.
# scope = "pr-only"

# ─── Reviews ──────────────────────────────────────────────────────────────────
[review]
# Auto mode waits until a PR's head commit has been unchanged this long before
# reviewing, so a burst of pushes costs one review, not five. `space` skips this.
# Default: "5m"
quiet_period = "5m"

# Most reviews that run at once. Also the most worktrees jawnSnow keeps per repo.
# Default: 2
max_in_flight = 2

# Most automatic reviews of one PR per day. `space` doesn't count toward or obey it.
# Default: 4
max_reviews_per_pr_per_day = 4

# Most turns one Claude run may take (passed to `claude --max-turns`).
# Default: 100
max_turns = 100

# A run still going after this is stopped and marked failed.
# Default: "25m"
run_timeout = "25m"

# A worktree unused for this long is removed. A lower value means less disk use and
# a faster `git` in your clone; the trade-off is a slower first review after idling.
# Default: "2h"
worktree_idle = "2h"

[review.budget]
# Spending cap for one review, in USD (passed to `claude --max-budget-usd`).
# A [[review.overrides]] block can change it for matching PRs.
# Default: 15
per_review_usd = 15

# Daily spending cap, in USD, in your local time zone. When today's total reaches
# it, auto mode pauses (the status bar says so); `space` asks before going over.
# Default: 250
daily_usd = 250

# Model and effort for a PR you haven't submitted a GitHub review on yet.
# Effort is one of "low", "medium", "high", "xhigh", "max".
# Overridden by [[review.overrides]], then by the Agent view for the current session,
# then by `c` for a single run.
# Default: model = "claude-opus-5-5", effort = "high"
[review.first_pass]
model  = "claude-opus-5-5"
effort = "high"

# Model and effort once you have submitted a GitHub review on the PR (an approval,
# a change request, or a comment with a summary). Same override order as first_pass.
# Default: model = "claude-sonnet-5-5", effort = "medium"
[review.follow_up]
model  = "claude-sonnet-5-5"
effort = "medium"

# ─── Overrides ────────────────────────────────────────────────────────────────
# Checked in order; the first block whose `tier` applies and whose `match` fits
# wins. It replaces only the keys it sets (model, effort, per_review_usd); the rest
# come from the tier. Default: no overrides.
#
#   tier  — "first_pass", "follow_up" or "any".
#   match — every key given must fit:
#     repo      glob on "owner/name"
#     author    glob on the PR author's login
#     label     the PR has this label
#     paths     globs; fits if any changed file matches one
#     min_lines / max_lines   bounds on additions + deletions

# [[review.overrides]]
# Big Terraform changes in mono keep Opus even on follow-ups.
# tier   = "any"
# match  = { repo = "chainguard-dev/mono", paths = ["**/*.tf"], min_lines = 200 }
# model  = "claude-opus-5-5"
# effort = "high"

# [[review.overrides]]
# Bot PRs get a cheap pass with a lower cap.
# tier           = "any"
# match          = { author = "*[bot]" }
# model          = "claude-haiku-5-5"
# effort         = "low"
# per_review_usd = 2

# ─── Theme ────────────────────────────────────────────────────────────────────
[theme]
# Markdown style for review text in the drawer and the post preview: glow's
# "dark" or "light" style. Pick the one that matches your terminal background.
# markdown = "dark"

# Override any status's label, color or spinner. Colors are xterm-256 indices
# 16–255 (0–15 are rejected because terminal themes remap them) or hex. Spinner is
# a bubbles spinner name ("dot", "line", "minidot", "pulse", "points", "meter") or
# "none". Unset keys keep the defaults shown here. DRAFTED is not a status: it is
# the pill a Wall card shows in place of its status while its latest Claude review
# is finished and not yet posted.
[theme.status]
# CI_WAITING        = { label = "Waiting on CI",                color = "214", spinner = "dot" }
# CI_FAILED         = { label = "CI failed",                    color = "203", spinner = "none" }
# READY_FOR_REVIEW  = { label = "Ready for you",                color = "39",  spinner = "none" }
# NEW_CHANGES       = { label = "New changes",                  color = "141", spinner = "dot" }
# CHANGES_REQUESTED = { label = "Waiting on author",            color = "208", spinner = "none" }
# APPROVED          = { label = "Approved",                     color = "41",  spinner = "none" }
# APPROVED_BY_YOU   = { label = "Approved by you · needs more", color = "41",  spinner = "none" }
# MERGED            = { label = "Merged",                       color = "140", spinner = "none" }
# CLOSED            = { label = "Closed",                       color = "244", spinner = "none" }
# DRAFTED           = { label = "Drafted",                      color = "213", spinner = "none" }

[theme.chrome]
# Colors of the UI frame, same formats as above. Defaults shown.
# accent = "153"   # ice blue: focused borders, active tab, the ❄ mark
# muted  = "67"    # slate: unfocused borders, secondary text
