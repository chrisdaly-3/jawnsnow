# jawnSnow config — ~/.config/jawnsnow/config.toml
# snow created this file once with the defaults. It reloads it when it changes and never writes to it again.
# Every value shown is the default. docs/configuration.md explains each key in full.
# Durations are Go-style: "90s", "5m", "36h"; "d" (days) is also accepted.

[mode]
default = "watcher"  # "watcher" reviews only on space or c; "auto" also queues reviews. `m` switches.

[github]
poll_interval = "3m"  # how often feeds are searched and PRs refreshed (min "1m"); hidden and stale PRs every 5×
ignore_checks = []    # check-name globs that never count as pending or failed, in every repo

# Each [[feeds]] block is one GitHub search; a PR is on the wall if any feed finds it. Yours replace this one.
[[feeds]]
name  = "review-requested"                                # unique label shown in filters and on cards
query = "is:pr is:open draft:false review-requested:@me"  # any GitHub PR search; drop draft:false to include drafts
since = "14d"                                             # only PRs updated within this window; a quieter PR goes stale

[done]
keep_for = "30d"  # how long merged, closed, hidden and stale PRs stay tracked

# Per-repo settings, keyed by "owner/name". A repo with no entry uses the defaults shown.
# [repos."chainguard-dev/mono"]
# path          = "~/code/mono"  # your clone to fetch PR refs into; unset, snow makes its own blobless clone
# scope         = "full"         # "full" reads around the change; "pr-only" reads only the PR's own files
# context       = []             # other local repos the reviewer may read
# focus         = []             # extra review rules for this repo
# design_refs   = []             # design docs (repo paths, PR numbers or URLs) to review against
# ignore_checks = []             # check-name globs ignored in this repo, on top of [github]'s

[review]
quiet_period               = "5m"   # auto mode waits until the head has been unchanged this long
max_in_flight              = 2      # most reviews at once, and most worktrees kept per repo
max_reviews_per_pr_per_day = 4      # most auto reviews of one PR a day; space and c don't count
run_timeout                = "25m"  # stop a Claude run after this; 0 means no timeout

[review.budget]
per_review_usd = 15   # spending cap for one review, in USD
daily_usd      = 250  # daily cap in USD, local time; auto mode pauses there, space and c ask first

# Effort is "low", "medium", "high", "xhigh" or "max". Overrides, then the Agent view, then `c` win over these.
[review.first_pass]
model  = "claude-opus-5-5"  # model for a PR you haven't submitted a GitHub review on
effort = "high"             # effort for that pass

[review.follow_up]
model  = "claude-sonnet-5-5"  # model once you've submitted a review on the PR
effort = "medium"             # effort for that pass

# Per-PR model, effort and budget; the first block that fits wins. None by default.
# match keys, all of which must fit: repo, author (globs), label, paths (globs), min_lines, max_lines.
# [[review.overrides]]
# tier           = "any"                                                 # "first_pass", "follow_up" or "any"
# match          = { repo = "chainguard-dev/mono", paths = ["**/*.tf"] }  # which PRs this block applies to
# model          = "claude-opus-5-5"                                     # replaces the tier's model
# effort         = "high"                                                # replaces the tier's effort
# per_review_usd = 15                                                    # replaces review.budget.per_review_usd

[theme]
# markdown = "dark"  # style of review text: "dark" or "light"

# Restyle a status. color: xterm 16–255 or "#rrggbb"; spinner: dot, line, minidot, pulse, points, meter or none.
[theme.status]
# CI_WAITING        = { label = "Waiting on CI",                color = "214", spinner = "dot" }
# CI_FAILED         = { label = "CI failed",                    color = "203", spinner = "none" }
# READY_FOR_REVIEW  = { label = "Ready for you",                color = "39",  spinner = "none" }
# NEW_CHANGES       = { label = "New changes",                  color = "141", spinner = "dot" }
# CHANGES_REQUESTED = { label = "Waiting on author",            color = "208", spinner = "none" }
# APPROVED          = { label = "Approved",                     color = "41",  spinner = "none" }
# APPROVED_BY_YOU   = { label = "Approved by you · needs more", color = "41",  spinner = "none" }
# MERGED            = { label = "Merged",                       color = "140", spinner = "none" }
# CLOSED            = { label = "Closed",                       color = "244", spinner = "none" }
# DRAFTED           = { label = "Drafted",                      color = "213", spinner = "none" }  # a finished review not yet posted

[theme.chrome]
# accent = "153"  # ice blue: focused borders, active tab, the ❄ mark
# muted  = "67"   # slate: unfocused borders, secondary text
